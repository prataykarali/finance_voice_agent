# Render Blueprint — Jan Sahay Voice Agent Backend (24/7 worker)
# Frontend is hosted on Vercel, only the Python agent needs Render.
# Deploy: https://dashboard.render.com → New → Blueprint → connect this repo
# Docs: https://render.com/docs/blueprint-spec

services:
  # Python LiveKit Voice Agent Worker + Metrics HTTP Server
  - type: web
    name: jan-sahay-voice-agent
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: MURF_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: METRICS_HOST
        value: 0.0.0.0
      - key: METRICS_PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: "1"
